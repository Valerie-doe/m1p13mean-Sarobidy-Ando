<app-header></app-header>

<div class="purchase-container">
  <div class="form-wrapper">

    <div class="form-header">
      <h1 class="form-title">
        {{ modeEdition ? 'Modifier la Boutique' : 'Nouvelle Boutique' }}
      </h1>
    </div>

    <div *ngIf="showSuccess" class="success-message">
      Boutique créée avec succès ✅
    </div>

    <div *ngIf="loginInfo && !modeEdition" class="login-info">
      <p>💻 Email : {{ loginInfo.email }}</p>
      <p>🔑 Mot de passe : {{ loginInfo.password }}</p>
    </div>

    <div *ngIf="errorMessage" class="field-error">
      {{ errorMessage }}
    </div>

    <form [formGroup]="boutiqueForm" (ngSubmit)="onSubmit()">

      <div class="form-grid">

        <div class="form-field">
          <label>Nom *</label>
          <input type="text" formControlName="name" class="field-input">
        </div>

        <div class="form-field">
          <label>Email *</label>
          <input type="email" formControlName="email" class="field-input">
        </div>

        <div class="form-field">
          <label>Catégorie *</label>
          <select formControlName="categoryId" class="field-input">
            <option value="">Sélectionner</option>
            <option *ngFor="let cat of categories" [value]="cat._id">
              {{ cat.name }}
            </option>
          </select>
        </div>

        <div class="form-field">
          <label>Téléphone</label>
          <input type="text" formControlName="phone" class="field-input">
        </div>

        <div class="form-field">
          <label>Website</label>
          <input type="text" formControlName="website" class="field-input">
        </div>

        <div class="form-field">
          <label>Heures d'ouverture</label>
          <input type="text" formControlName="openingHours" class="field-input">
        </div>

        <div class="form-field">
          <label>Description</label>
          <textarea formControlName="description" class="field-input"></textarea>
        </div>

        <div class="form-field">
          <label>Image URL</label>
          <input type="text" formControlName="imageUrl" class="field-input">
        </div>

      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="boutiqueForm.invalid || loading">
          {{ loading ? 'Création...' : 'Créer' }}
        </button>
      </div>

    </form>
  </div>
</div>
